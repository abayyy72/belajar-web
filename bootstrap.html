<!DOCTYPE html>
<html lang="en">
<head>

    <title>Belajar bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="container">
        <h1 class="text-danger text-center mt-4">Belajar Pakai Bootstrap</h1>
        <!-- 
        warna di bootstrap
        primmary = biru
        secondary = abu abu
        danger = merah
        warning = kuning
        success = hijau
        info = biru muda
        dark = hitam
        light = putih
         -->
        <div class="container text-center">
            <button class="btn btn-primary rounded-pill">Klik Me</button>
            <button class="btn btn-secondary rounded-pill">Klik Me</button>
            <button class="btn btn-danger rounded-pill">Klik Me</button>
            <button class="btn btn-warning text-success rounded-pill">Klik Me</button>
            <button class="btn btn-success rounded-pill">Klik Me</button>
            <button class="btn btn-info rounded-pill">Klik Me</button>
            <button class="btn btn-dark rounded-pill">Klik Me</button>
        </div>
    </div>

    <header class="bg-primary mt-4">
